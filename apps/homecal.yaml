apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homecal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/autumnfallenwang/homecal.git
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: homecal
      valueFiles:
        - values.yaml
      # GHA workflow (.github/workflows/build.yml `bump-arch-infra` job) rewrites
      # BOTH api.image.tag and web.image.tag to the same commit SHA on every
      # successful main build — a single yq expression bumps them atomically so
      # ArgoCD rolls api + web together (the contract evolves in lockstep, esp.
      # NEXT_PUBLIC_AUTH_URL which is baked into the web bundle at build time).
      # Initial "latest" matches the chart defaults; the GHCR packages don't
      # exist until the first build completes + D2 step 3 flips them public,
      # so expect ImagePullBackOff briefly on first sync.
      parameters:
        - name: api.image.tag
          value: "b966f6b69b5bcfe63c07f0b4d2386013ae915d52"
        - name: web.image.tag
          value: "b966f6b69b5bcfe63c07f0b4d2386013ae915d52"
        # Enabled 2026-07-09: homecal-secrets exist and Phase-21 shipped migration
        # 0011 (digest_settings + users.receivesDailyDigest). ArgoCD now runs the
        # Helm pre-upgrade hook Job on each sync to auto-apply pending Drizzle
        # migrations. (History: stayed "false" through the Phase-19 cutover since
        # G5 pg_restore brought the schema along and G7 bootstrapped __drizzle_migrations.)
        - name: migrate.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: homecal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
