apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homestorm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/autumnfallenwang/homestorm.git
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: homestorm
      valueFiles:
        - values.yaml
      # The GHA workflow (bump-arch-infra job) rewrites BOTH api.image.tag and
      # web.image.tag to the same commit SHA on every successful main build, so
      # ArgoCD rolls api + web together. The images are public on GHCR (they
      # inherit the public repo's visibility), so the cluster needs no pull secret.
      parameters:
        - name: api.image.tag
          value: "7a20c6060218219208abdb11c9d20dffa834b717"
        - name: web.image.tag
          value: "7a20c6060218219208abdb11c9d20dffa834b717"
        # Off: the api applies its migrations at boot (see deploy/chart/values.yaml).
        - name: migrate.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: homestorm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
