persistence:
  enabled: true
  size: 5Gi
  storageClassName: local-path

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        # ⚠️ Pinned. Dashboards and alert rules refer to the data source by uid; without this it
        # was auto-generated (P8E80F9AEF21F6940) and every provisioned rule said "datasource not
        # found". Safe to pin while nothing referred to the old uid (0 dashboards, 0 rules).
        uid: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
        isDefault: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.arch.internal
  path: /

# Default admin user is "admin"; password auto-generated, in secret `grafana`.
# Retrieve with:
#   kubectl -n observability get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d

# ── Dashboards and alert rules, as code ────────────────────────────────────────────────────────
# Source of truth: homeparentcontrol/deploy/observability/ (README there). Copied here because this
# chart is what Argo CD deploys; edit there first, then paste. Every query was run against live
# Loki before it was committed (2026-09-28).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: home-apps
        orgId: 1
        folder: Home apps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/home-apps

dashboards:
  home-apps:
    # One dashboard for every home app: they all log the same http.request shape.
    home-http-overview:
      json: |
        {
          "uid": "home-http-overview",
          "title": "Home apps \u2014 HTTP overview",
          "description": "One dashboard for every home app: they all log the same http.request shape (see ADR 0012 in homeparentcontrol). Pick the app with the namespace variable.",
          "tags": [
            "home-apps",
            "http",
            "loki"
          ],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "1m",
          "time": {
            "from": "now-24h",
            "to": "now"
          },
          "templating": {
            "list": [
              {
                "name": "namespace",
                "label": "App",
                "type": "custom",
                "query": "homeparentcontrol,homework,homecal,homenews,llmgw",
                "current": {
                  "text": "homeparentcontrol",
                  "value": "homeparentcontrol"
                },
                "options": [
                  {
                    "text": "homeparentcontrol",
                    "value": "homeparentcontrol",
                    "selected": true
                  },
                  {
                    "text": "homework",
                    "value": "homework",
                    "selected": false
                  },
                  {
                    "text": "homecal",
                    "value": "homecal",
                    "selected": false
                  },
                  {
                    "text": "homenews",
                    "value": "homenews",
                    "selected": false
                  },
                  {
                    "text": "llmgw",
                    "value": "llmgw",
                    "selected": false
                  }
                ]
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Requests per 5 minutes, by status class",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | status < 400 [5m]))",
                  "queryType": "range",
                  "legendFormat": "2xx/3xx"
                },
                {
                  "refId": "B",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | status >= 400 | status < 500 [5m]))",
                  "queryType": "range",
                  "legendFormat": "4xx"
                },
                {
                  "refId": "C",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | status >= 500 [5m]))",
                  "queryType": "range",
                  "legendFormat": "5xx"
                }
              ],
              "fieldConfig": {
                "defaults": {},
                "overrides": []
              },
              "description": "Every app logs one http.request line per request. Apps that still log /health include their probes here."
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "p95 latency (ms)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "quantile_over_time(0.95, {namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | unwrap latency_ms | __error__=\"\" [5m]) by ()",
                  "queryType": "range",
                  "legendFormat": "p95"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ms"
                },
                "overrides": []
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "5xx in the selected range",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 0,
                "y": 8,
                "w": 6,
                "h": 6
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | status >= 500 [$__range])) or vector(0)",
                  "queryType": "instant"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background"
              }
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Error lines by event",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 6,
                "y": 8,
                "w": 18,
                "h": 6
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum by (event) (count_over_time({namespace=\"$namespace\"} | json | __error__=\"\" | level=~\"error|fatal|50|60\" [5m]))",
                  "queryType": "range",
                  "legendFormat": "{{event}}"
                }
              ],
              "fieldConfig": {
                "defaults": {},
                "overrides": []
              },
              "description": "Levels are words since ADR 0012; the numbers match lines written before it and apps not yet switched."
            },
            {
              "id": 5,
              "type": "table",
              "title": "Slowest paths (average ms, selected range)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 0,
                "y": 14,
                "w": 12,
                "h": 9
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "topk(10, avg by (path) (avg_over_time({namespace=\"$namespace\", container=~\"api|llmgw\"} | json | __error__=\"\" | event=\"http.request\" | unwrap latency_ms | __error__=\"\" [$__range])))",
                  "queryType": "instant"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ms"
                },
                "overrides": []
              }
            },
            {
              "id": 6,
              "type": "logs",
              "title": "Error lines",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "x": 12,
                "y": 14,
                "w": 12,
                "h": 9
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "{namespace=\"$namespace\"} | json | __error__=\"\" | level=~\"error|fatal|50|60\"",
                  "queryType": "range"
                }
              ],
              "options": {
                "showTime": true,
                "wrapLogMessage": true,
                "sortOrder": "Descending"
              }
            }
          ]
        }
    hpc-agent-health:
      json: |
        {
          "uid": "hpc-agent-health",
          "title": "homeparentcontrol \u2014 agent health",
          "description": "Is the system working? Deliberately contains NOTHING about the child's usage \u2014 that is product data and belongs in the parent UI.",
          "tags": [
            "homeparentcontrol"
          ],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "1m",
          "time": {
            "from": "now-7d",
            "to": "now"
          },
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Agent status",
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 0
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "textMode": "value"
              },
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "1": {
                          "text": "HEALTHY",
                          "color": "green",
                          "index": 0
                        },
                        "2": {
                          "text": "EXPECTED OFFLINE",
                          "color": "blue",
                          "index": 1
                        },
                        "3": {
                          "text": "SILENT",
                          "color": "orange",
                          "index": 2
                        },
                        "4": {
                          "text": "NOT ENFORCING",
                          "color": "red",
                          "index": 3
                        }
                      }
                    }
                  ]
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "max((sum(count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" | state=\"DEGRADED\" [5m])) or vector(0)) * 4 or (sum(count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" | state=~\"UNEXPECTED_SILENCE|SILENT_TOO_LONG\" [5m])) or vector(0)) * 3 or (sum(count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" | state=\"EXPECTED_OFFLINE\" [5m])) or vector(0)) * 2 or (sum(count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" | state=\"HEALTHY\" [5m])) or vector(0)))",
                  "refId": "A",
                  "queryType": "instant"
                }
              ]
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Health evaluations (last 10m)",
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 6,
                "y": 0
              },
              "description": "The liveness job emits one line per device per minute. Zero here means monitoring is blind, which is what A5 alerts on.",
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" [10m])) or vector(0)",
                  "refId": "A",
                  "queryType": "instant"
                }
              ]
            },
            {
              "id": 3,
              "type": "logs",
              "title": "Agent version and boot",
              "gridPos": {
                "h": 4,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "options": {
                "showTime": true,
                "wrapLogMessage": true
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "{namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent.sync\" | line_format \"{{.device_id}} v{{.agent_version}} tick={{.tick_seq}} cadence={{.cadence}}\"",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 4,
              "type": "state-timeline",
              "title": "\u2b50 Online / offline, 7 days",
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 4
              },
              "description": "The shape of normal. An anomaly shows up here without anyone defining what anomalous means.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "fillOpacity": 80,
                    "lineWidth": 0
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum by (state) (count_over_time({namespace=\"homeparentcontrol\", container=\"api\"} | json | event=\"agent_status\" | label_format state=state [$__auto]))",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 5,
              "type": "logs",
              "title": "Warnings and errors",
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 0,
                "y": 13
              },
              "options": {
                "showTime": true,
                "wrapLogMessage": true
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "{namespace=\"homeparentcontrol\"} | json | level=~\"warn|error|fatal|40|50|60\"",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 6,
              "type": "logs",
              "title": "Enforcement events",
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 12,
                "y": 13
              },
              "description": "What actually happened on the Mac, as the control plane saw it arrive.",
              "options": {
                "showTime": true,
                "wrapLogMessage": true
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "{namespace=\"homeparentcontrol\", container=\"api\"} | json | event=~\"agent_status_notify|agent_status_reclassified|policy.published|override.granted|device.revoke|device.decommission\"",
                  "refId": "A"
                }
              ]
            }
          ]
        }

# ⚠️ Rules fire, but nothing RECEIVES them yet: there is no contact point beyond Grafana's default
# email receiver and no SMTP (C6, an owner decision). ⚠️ The chart passes this block through Helm's
# `tpl`, so it must contain no Go-template braces.
alerting:
  rules.yaml:
    # Grafana unified-alerting rules, provisioned as code.
    #
    # ⚠️ Read deploy/observability/README.md first. Every selector here is
    # `{namespace="homeparentcontrol"}` because the labels §7.5's examples use do
    # not exist in this cluster, and a rule that matches nothing fires a
    # synthetic No-Data alert that bypasses the notification policy.
    #
    # ⚠️ **Five rules. That is the upper limit for a one-agent home system, and
    # it is a limit rather than a starting point.** Every alert that fires and
    # needs no action trains the parent to ignore the next one.
    # ⚠️ No Go-template braces anywhere in this file. The grafana chart passes
    # `alerting` through Helm's `tpl`, which fails on Grafana's own label
    # templates. The queries aggregate without a device label anyway, so the old
    # per-device summaries rendered empty.
    apiVersion: 1
    groups:
      - orgId: 1
        name: homeparentcontrol
        folder: homeparentcontrol
        # One minute: the liveness job evaluates every 60 s, so a shorter
        # interval re-reads the same line and a longer one adds latency to a
        # signal that is already a minute coarse.
        interval: 1m
        rules:
          # ── A1. The agent went quiet unexpectedly.
          - uid: hpc-a1-unexpected-silence
            title: Agent unexpectedly silent
            condition: threshold
            for: 5m
            labels:
              severity: critical
              app: homeparentcontrol
            annotations:
              summary: "A Mac stopped checking in"
              # ⚠️ The wording matters as much here as in the UI. §4.6: the
              # natural reading of "offline" is "the rules stopped", which is
              # the opposite of the truth.
              description: >-
                The Mac has not checked in for several minutes. It is STILL
                ENFORCING the rules it already has — a cached policy never
                expires. What is lost is new rules and new grants reaching it.
            data:
              - refId: query
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  # `or vector(0)` on the AGGREGATED expression forces a numeric
                  # result when nothing matches. Applied to the inner range
                  # vector instead it would not.
                  expr: >-
                    sum(count_over_time({namespace="homeparentcontrol", container="api"}
                    | json | event="agent_status" | state="UNEXPECTED_SILENCE" [5m])) or vector(0)
                  queryType: instant
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  refId: threshold
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            # Every rule except A5 treats No Data as OK: the control plane's
            # stream is always alive, so genuine No Data here means Loki or
            # Grafana is broken — which is A5's job to say, once, rather than
            # each rule saying it separately.
            noDataState: OK
            execErrState: Error

          # ── A2. Quiet long enough that it is not a reboot.
          - uid: hpc-a2-silent-too-long
            title: Agent silent too long
            condition: threshold
            for: 10m
            labels:
              severity: warning
              app: homeparentcontrol
            annotations:
              summary: "A Mac has been silent for over a day"
              description: >-
                Still enforcing its cached rules, but it has not been reachable
                for a long time. If the Mac is away on purpose, set "Away until…"
                on its device page rather than silencing this.
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  expr: >-
                    sum(count_over_time({namespace="homeparentcontrol", container="api"}
                    | json | event="agent_status" | state="SILENT_TOO_LONG" [10m])) or vector(0)
                  queryType: instant
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  refId: threshold
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error

          # ── A3. Ticking, but cannot determine the rules.
          - uid: hpc-a3-degraded
            title: Agent degraded — not enforcing
            condition: threshold
            for: 3m
            labels:
              severity: warning
              app: homeparentcontrol
            annotations:
              # ⚠️ The ONE state where "still enforcing" would be a lie. §4.6's
              # fail-open branch is only defensible while it is loud, and this
              # is the loud part.
              summary: "A Mac is NOT enforcing"
              description: >-
                The agent is running and reachable but cannot read its rules, so
                it is failing open. Bedtime will not happen until this is fixed.
            data:
              - refId: query
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  expr: >-
                    sum(count_over_time({namespace="homeparentcontrol", container="api"}
                    | json | event="agent_status" | state="DEGRADED" [3m])) or vector(0)
                  queryType: instant
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  refId: threshold
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error

          # ── A4. Crash loop.
          #
          # ⚠️ Rewritten. §7.5 reads this off the AGENT's log stream, and the
          # agent is a Mac daemon whose logs never reach Loki. The control
          # plane's own view of the same fact is how many `agent.started` events
          # it ingested, counted on the `agent.events` line.
          - uid: hpc-a4-crash-loop
            title: Agent restarting repeatedly
            condition: threshold
            for: 0m
            labels:
              severity: critical
              app: homeparentcontrol
            annotations:
              summary: "The agent has restarted more than 3 times in 10 minutes"
              description: >-
                Repeated restarts mean the supervisor is probably rolling back,
                or launchd is respawning a crashing enforcer. Enforcement still
                happens between crashes, but check the device page.
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  expr: >-
                    sum(sum_over_time({namespace="homeparentcontrol", container="api"}
                    | json | event="agent.events" | unwrap agent_started [10m])) or vector(0)
                  queryType: instant
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  refId: threshold
                  conditions:
                    - evaluator: { type: gt, params: [3] }
            noDataState: OK
            execErrState: Error

          # ── A5. The watcher of the watchman.
          - uid: hpc-a5-liveness-stopped
            title: Health monitoring itself has stopped
            condition: threshold
            for: 10m
            labels:
              severity: critical
              app: homeparentcontrol
            annotations:
              summary: "No health evaluations in 10 minutes — monitoring is blind"
              description: >-
                The liveness job emits a line per device per minute. Silence here
                means the API is down, the scheduler is wedged, or Loki stopped
                ingesting. Every other alert in this folder is unreliable until
                this clears.
            data:
              - refId: query
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  expr: >-
                    sum(count_over_time({namespace="homeparentcontrol", container="api"}
                    | json | event="agent_status" [10m])) or vector(0)
                  queryType: instant
                  refId: query
              - refId: threshold
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: query
                  refId: threshold
                  conditions:
                    - evaluator: { type: lt, params: [5] }
            # ★ The ONLY rule that alerts on No Data, and it has to.
            #
            # Every other rule here asks "did something bad appear?" — absence is
            # good news. This one asks "is the monitoring alive?", where absence
            # IS the bad news. ⚠️ Grafana's No-Data alert is synthetic and may not
            # inherit the notification policy, which is precisely why only one
            # rule is allowed to depend on it, and why the `or vector(0)` above
            # is still there as the first line of defence.
            noDataState: Alerting
            execErrState: Alerting
